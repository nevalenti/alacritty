[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "SemiBold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[window]
decorations = "None"
padding = { x = 16, y = 8 }
dynamic_padding = true

[selection]
save_to_clipboard = true

[general]
live_config_reload = true
import = ["/home/nevalenti/.config/alacritty/nvim.toml"]

[cursor]
style = { shape = "Block", blinking = "Off" }
vi_mode_style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true

[scrolling]
history = 50000

[mouse]
hide_when_typing = true

[terminal]
osc52 = "CopyPaste"
